# Configuração do MySQL portátil — Sistema de Controle Patrimonial
#
# Este arquivo diz ao MySQL portátil ONDE ficam seus arquivos e EM QUE PORTA
# ele deve "escutar" (3307, em vez da porta padrão 3306, pra nunca brigar com
# outro MySQL que já exista em algum computador).
#
# IMPORTANTE: este arquivo assume que você vai extrair o MySQL portátil
# exatamente na pasta C:\PatrimonioPortatil\mysql\ — se usar outra pasta,
# troque os dois caminhos abaixo (basedir e datadir) para bater com o que
# você escolheu.

[mysqld]
port=3307
basedir=C:/PatrimonioPortatil/mysql
datadir=C:/PatrimonioPortatil/mysql/data

[client]
port=3307
