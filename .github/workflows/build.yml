name: Gerar programas Windows

# Roda sozinho toda vez que você faz "Commit changes" no repositório,
# e também pode ser disparado manualmente na aba Actions (botão "Run workflow").
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # Máquina Windows temporária, na nuvem do GitHub — de graça.
    runs-on: windows-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python (só nesta máquina da nuvem, não no seu PC)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller e as bibliotecas da API
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install pymysql bcrypt

      - name: Gerar SistemaPatrimonialAPI.exe
        working-directory: backend
        run: pyinstaller build/api.spec

      - name: Gerar ConfigurarTudo.exe
        working-directory: instalador
        run: pyinstaller build_configurador.spec

      - name: Gerar IniciarSistema.exe
        working-directory: instalador
        run: pyinstaller build_iniciar.spec

      - name: Gerar PararSistema.exe
        working-directory: instalador
        run: pyinstaller build_parar.spec

      - name: Juntar os 4 .exe numa pasta só
        shell: cmd
        run: |
          mkdir programas-windows
          copy backend\dist\SistemaPatrimonialAPI.exe programas-windows\
          copy instalador\dist\ConfigurarTudo.exe programas-windows\
          copy instalador\dist\IniciarSistema.exe programas-windows\
          copy instalador\dist\PararSistema.exe programas-windows\

      - name: Publicar os 4 .exe como Artifact para download
        uses: actions/upload-artifact@v4
        with:
          name: programas-windows
          path: programas-windows/
          retention-days: 14
